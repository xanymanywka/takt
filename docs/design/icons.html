<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Такт — варианты иконки, серия 3 (буква Т)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#080808;--fg:#F4F4F0;--mut:#B8B8B0;--acc:#C8FF00;--card:#111;--line:#262626}
  :root[data-theme=light]{--bg:#F6F6F2;--fg:#0A0A0A;--mut:#4A4A46;--acc:#7CA000;--card:#fff;--line:#D8D8D2}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Montserrat,system-ui,sans-serif;padding:40px 32px}
  h1{font-size:28px;font-weight:600;margin:0 0 6px}
  p{color:var(--mut);margin:0 0 28px;max-width:760px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
  .v{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
  .v h2{font-size:17px;font-weight:600;margin:0 0 4px}
  .v h2 span{color:var(--acc);margin-right:10px}
  .v .d{color:var(--mut);font-size:13.5px;margin:0 0 16px;min-height:80px}
  .row{display:flex;align-items:flex-end;gap:18px}
  .row svg{display:block}
  .dock{display:flex;gap:12px;align-items:flex-end;background:linear-gradient(#2a2a2a,#161616);padding:10px 12px;border-radius:14px;margin-top:16px}
  .dock.l{background:linear-gradient(#f0f0ec,#d9d9d3)}
  .dock svg{width:48px;height:48px}
  .tg{position:fixed;top:20px;right:24px;background:var(--card);border:1px solid var(--line);color:var(--fg);padding:8px 14px;border-radius:999px;font:inherit;cursor:pointer}
</style>
</head>
<body>
<button class="tg" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light'">Тема</button>
<h1>Такт — иконка, серия 3: буква Т из узлов</h1>
<p>Развитие вариантов 1 и 6 из серии 2: нейросеть из узлов, собранная в букву Т. Лайм отмечает ядро-дирижёра. Сквиркл macOS, графит #080808 + лайм #C8FF00. Размеры 128 / 64 / 32 и вид в доке.</p>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <clipPath id="sq" clipPathUnits="objectBoundingBox">
      <path d="M.5 0C.11 0 0 .11 0 .5S.11 1 .5 1 1 .89 1 .5 .89 0 .5 0z"/>
    </clipPath>

    <!-- 1. Т из узлов: перекладина с двумя белыми узлами, лаймовое ядро в точке стыка, ножка к узлу-исполнителю -->
    <symbol id="i1" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#080808"/>
      <g stroke="#F4F4F0" stroke-width="4.5" stroke-linecap="round"><path d="M24 30h52M50 30v46"/></g>
      <circle cx="24" cy="30" r="7" fill="#F4F4F0"/><circle cx="76" cy="30" r="7" fill="#F4F4F0"/><circle cx="50" cy="76" r="7" fill="#F4F4F0"/>
      <circle cx="50" cy="30" r="11" fill="#C8FF00"/>
    </symbol>
    <!-- 2. Т-дерево: лаймовое ядро внизу ножки, от перекладины вниз три узла-исполнителя -->
    <symbol id="i2" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#080808"/>
      <g stroke="#F4F4F0" stroke-width="4.5" stroke-linecap="round"><path d="M22 28h56M50 28v44M22 28v14M78 28v14"/></g>
      <circle cx="22" cy="44" r="6" fill="#F4F4F0"/><circle cx="78" cy="44" r="6" fill="#F4F4F0"/>
      <circle cx="50" cy="74" r="10" fill="#C8FF00"/>
    </symbol>
    <!-- 3. Жирная Т + ветка: монолитная белая буква, от стыка вправо-вверх лаймовая связь к узлу -->
    <symbol id="i3" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#080808"/>
      <path d="M22 24h56v12H56v44H44V36H22z" fill="#F4F4F0"/>
      <path d="M50 54 72 70" stroke="#C8FF00" stroke-width="4" stroke-linecap="round"/>
      <circle cx="74" cy="72" r="7" fill="#C8FF00"/>
      <circle cx="50" cy="54" r="4.5" fill="#080808"/><circle cx="50" cy="54" r="2.5" fill="#C8FF00"/>
    </symbol>
    <!-- 4. Т-палочка: перекладина как взмах-дуга из узлов, ножка-палочка, лаймовое ядро наверху по центру -->
    <symbol id="i4" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#080808"/>
      <path d="M24 38q26-16 52 0" stroke="#F4F4F0" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <path d="M50 30v46" stroke="#F4F4F0" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="24" cy="38" r="6.5" fill="#F4F4F0"/><circle cx="76" cy="38" r="6.5" fill="#F4F4F0"/><circle cx="50" cy="76" r="6" fill="#F4F4F0"/>
      <circle cx="50" cy="30" r="10" fill="#C8FF00"/>
    </symbol>
    <!-- 5. Т в сети: буква из узлов, вокруг стыка лаймовое кольцо-орбита, узлы по концам -->
    <symbol id="i5" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#080808"/>
      <g stroke="#F4F4F0" stroke-width="4" stroke-linecap="round"><path d="M22 32h56M50 32v44"/></g>
      <circle cx="22" cy="32" r="6" fill="#F4F4F0"/><circle cx="78" cy="32" r="6" fill="#F4F4F0"/><circle cx="50" cy="76" r="6" fill="#F4F4F0"/>
      <circle cx="50" cy="32" r="13" fill="#080808" stroke="#C8FF00" stroke-width="4"/>
      <circle cx="50" cy="32" r="5" fill="#C8FF00"/>
    </symbol>
    <!-- 6. Т с искрой: белая Т из узлов, на правом конце перекладины лаймовая искра ИИ -->
    <symbol id="i6" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#080808"/>
      <g stroke="#F4F4F0" stroke-width="4.5" stroke-linecap="round"><path d="M24 34h40M50 34v42"/></g>
      <circle cx="24" cy="34" r="6.5" fill="#F4F4F0"/><circle cx="50" cy="34" r="6.5" fill="#F4F4F0"/><circle cx="50" cy="76" r="6.5" fill="#F4F4F0"/>
      <path d="M74 18c1.5 10 4.5 13 14 14-9.5 1.5-12.5 4.5-14 14-1.5-9.5-4.5-12.5-14-14 9.5-1.5 12.5-4.5 14-14z" fill="#C8FF00"/>
    </symbol>
  </defs>
</svg>

<div class="grid" id="grid"></div>

<script>
const V=[
 ['Т из узлов','Перекладина и ножка из связей, узлы-исполнители по концам, лаймовое ядро в стыке буквы. Прямой наследник варианта 1.'],
 ['Т-дерево','Ядро-дирижёр лаймом внизу ножки, от перекладины вниз свисают узлы-исполнители. Буква читается крупно, ядро — «держит» всех.'],
 ['Жирная Т + ветка','Монолитная белая буква, из её центра лаймовая связь к узлу-агенту. Самая читаемая Т на 32 px.'],
 ['Т-палочка','Перекладина изогнута как взмах палочки, ножка — сама палочка, лаймовое ядро наверху. Наследник варианта 6.'],
 ['Т в сети','Буква из узлов, стык обведён лаймовым кольцом-орбитой. Больше «ИИ-ядра» в центре.'],
 ['Т с искрой','Белая Т из узлов, на правом плече лаймовая искра ИИ. Буква + узнаваемый знак нейросетей.'],
];
const g=document.getElementById('grid');
V.forEach((v,i)=>{
 const id='i'+(i+1);
 const use=(s)=>`<svg width="${s}" height="${s}" style="clip-path:url(#sq)"><use href="#${id}" width="${s}" height="${s}"/></svg>`;
 const nb=`<svg width="48" height="48" style="clip-path:url(#sq)"><rect width="48" height="48" fill="#3478F6"/></svg><svg width="48" height="48" style="clip-path:url(#sq)"><rect width="48" height="48" fill="#E9E9E4"/></svg>`;
 g.insertAdjacentHTML('beforeend',`<div class="v"><h2><span>${i+1}</span>${v[0]}</h2><p class="d">${v[1]}</p>
 <div class="row">${use(128)}${use(64)}${use(32)}</div>
 <div class="dock">${use(48)}${nb}</div><div class="dock l">${use(48)}${nb}</div></div>`);
});
</script>
</body>
</html>
