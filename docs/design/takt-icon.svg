<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Takt · иконка приложения · графит #080808 + лайм #C8FF00.
       Рисунок на весь холст без собственных полей и скругления: с macOS 26 система сама кладёт
       иконку в свой сквиркл-контейнер, а иконка с встроенными полями выглядит «усаженной». -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#161616"/><stop offset="1" stop-color="#060606"/></linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- Глифу 100×100 → масштаб 7.2, центр холста -->
  <g transform="translate(152 123) scale(7.2)">
    <g stroke="#F4F4F0" stroke-width="4.4" stroke-linecap="round"><path d="M22 32h56M50 32v44"/></g>
    <circle cx="22" cy="32" r="6.5" fill="#F4F4F0"/><circle cx="78" cy="32" r="6.5" fill="#F4F4F0"/><circle cx="50" cy="76" r="6.5" fill="#F4F4F0"/>
    <circle cx="50" cy="32" r="14" fill="#0A0A0A" stroke="#C8FF00" stroke-width="4.4"/>
    <circle cx="50" cy="32" r="5.5" fill="#C8FF00"/>
  </g>
</svg>
